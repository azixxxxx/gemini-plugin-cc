name: Feature request
description: Suggest a change to the plugin
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How the plugin could help. Commands, flags, or output you have in mind.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
