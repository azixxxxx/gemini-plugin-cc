# Guardrail for write-capable Gemini runs started by the Gemini plugin for Claude Code.
#
# Loaded with `gemini --admin-policy` next to `--approval-mode yolo`. Gemini may edit
# files and run commands, but Claude Code reviews the result and decides what gets
# committed or pushed. Prefix rules are a guardrail, not a security boundary.

[[rule]]
toolName = "run_shell_command"
commandPrefix = ["git commit", "git push"]
decision = "deny"
priority = 999
denyMessage = "Claude Code reviews and commits delegated changes. Leave your edits uncommitted and do not push."
